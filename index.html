<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
    <script src="js/stations.js" defer></script>
    <script src="js/app.js" defer></script>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="top-bottom" id="top">
        <img src="img/top.jpeg" alt="">
    </div>
<div class="header">
<a href="select.html">
  <img src="img/Type_Standard_Brand_GO_State_Black_dmvcea.svg" alt="GO Transit" class="goLogo">
</a>
<div class="headerWraper">
    <h1 class="heading">&#8226; &emsp;&emsp;&emsp;GO TRANSIT&emsp;&emsp;&emsp; &#8226;</h1>
</div>
<p class="location"></p>

</div>
<div class="circle"></div>
<div class="info">
    <div class="infoTicket">
        <img src="img/X1.jpg" alt="">
        <img src="img/IMG_4767.jpeg" alt="">
        <img src="img/OneWay.jpg" alt="">
    </div>
    <div class="ticketnumber">
        <p>Ticket Number: <span>MZ6588200</span></p>
    </div>
    <div class="barcode">
        <p>ACTIVE</p>
    </div>
    <div class="time">
        <div class="currentTime">
            <p>CURRENT DATE & TIME</p>
            <p class="currentrunningtime">

            </p>
        </div>
        <div class="activationTime">
            <p>TIME SINCE ACTIVATION:</p>
            <p class="activitionRunningTime">

            </p>
        </div>
    </div>
</div>
<div class="footer">
    <p class="showprof">
        Please show proof of your ticket to the Customer Protective Officers when asked
    </p>
    <div class="timer"></div>
</div>
<div class="top-bottom" id="bottom">
    <img src="img/bottom.jpeg" alt="">    
</div>
</div>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
